name: Manual EKS Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target EKS namespace to roll back'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Roll back target EKS namespace
        env:
          TARGET_NS: ${{ inputs.environment }}
        run: |
          aws eks update-kubeconfig --name dhaba-eks --region "${{ secrets.AWS_REGION }}"
          kubectl rollout undo deployment -n "$TARGET_NS"
          kubectl rollout status deployment -n "$TARGET_NS" --timeout=150s
          echo "### ⏪ MANUAL ROLLBACK COMPLETED on \`${TARGET_NS}\` by ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
