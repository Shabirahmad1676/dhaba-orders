name: Build, Scan & Deploy to AWS EKS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      menu-api: ${{ steps.filter.outputs.menu-api }}
      orders-api: ${{ steps.filter.outputs.orders-api }}
      kitchen-worker: ${{ steps.filter.outputs.kitchen-worker }}
      stats-api: ${{ steps.filter.outputs.stats-api }}
      ops-monitor: ${{ steps.filter.outputs.ops-monitor }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web: ['web/**']
            menu-api: ['menu-api/**']
            orders-api: ['orders-api/**']
            kitchen-worker: ['kitchen-worker/**']
            stats-api: ['stats-api/**']
            ops-monitor: ['ops-monitor/**', 'scripts/monitor/**']

  build-and-push-ecr:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.web == 'true' ||
      needs.detect-changes.outputs.menu-api == 'true' ||
      needs.detect-changes.outputs.orders-api == 'true' ||
      needs.detect-changes.outputs.kitchen-worker == 'true' ||
      needs.detect-changes.outputs.stats-api == 'true' ||
      needs.detect-changes.outputs.ops-monitor == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, menu-api, orders-api, kitchen-worker, stats-api, ops-monitor]
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        if: needs.detect-changes.outputs[matrix.service] == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        if: needs.detect-changes.outputs[matrix.service] == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, Trivy scan, and push to ECR
        if: needs.detect-changes.outputs[matrix.service] == 'true'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          CONTEXT="${{ matrix.service }}"
          [ "${{ matrix.service }}" = "ops-monitor" ] && CONTEXT="."
          IMAGE="${REGISTRY}/dhaba/${{ matrix.service }}"
          docker build --build-arg GIT_SHA="${{ github.sha }}" \
            -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" \
            -f "${{ matrix.service }}/Dockerfile" "$CONTEXT"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasecurity/trivy:latest image --exit-code 1 --severity CRITICAL --no-progress \
            "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

  deploy-staging:
    needs: [detect-changes, build-and-push-ecr]
    if: always() && needs.build-and-push-ecr.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Deploy to EKS staging with smoke tests & rollback
        run: |
          aws eks update-kubeconfig --name dhaba-eks --region "${{ secrets.AWS_REGION }}"
          STAGING_HOST=$(kubectl get ingress dhaba-ingress -n staging -o jsonpath='{.spec.rules[0].host}')
          if kubectl apply -k k8s/overlays/staging && \
             kubectl rollout restart deployment -n staging && \
             kubectl rollout status deployment -n staging --timeout=150s && \
             ./scripts/smoke-test.sh "http://${STAGING_HOST}"; then
            echo "### ✅ STAGING DEPLOY SUCCEEDED (\`${{ github.sha }}\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            kubectl rollout undo deployment -n staging || true
            echo "### ⏪ STAGING ROLLED BACK (\`${{ github.sha }}\`)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Deploy to EKS production with smoke tests & rollback
        run: |
          aws eks update-kubeconfig --name dhaba-eks --region "${{ secrets.AWS_REGION }}"
          PROD_HOST=$(kubectl get ingress dhaba-ingress -n production -o jsonpath='{.spec.rules[0].host}')
          if kubectl apply -k k8s/overlays/production && \
             kubectl rollout restart deployment -n production && \
             kubectl rollout status deployment -n production --timeout=150s && \
             ./scripts/smoke-test.sh "http://${PROD_HOST}"; then
            echo "### ✅ PRODUCTION DEPLOY SUCCEEDED (\`${{ github.sha }}\`) — Approved by ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          else
            kubectl rollout undo deployment -n production || true
            echo "### ⏪ PRODUCTION ROLLED BACK (\`${{ github.sha }}\`)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
