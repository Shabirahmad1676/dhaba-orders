apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: ops
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'dhaba-dashboards'
        orgId: 1
        folder: 'Dhaba Ops'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dhaba-dashboard-json
  namespace: ops
data:
  dhaba-cluster.json: |
    {
      "title": "Dhaba Orders - Live Pod Telemetry",
      "uid": "dhaba-live-ops",
      "timezone": "browser",
      "refresh": "5s",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "title": "CPU Usage by Pod (cores/s) - Production & Staging",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"production|staging\", container!=\"\", container!=\"POD\"}[1m])) by (namespace, pod)",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Memory Working Set (MB) - Production & Staging",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=~\"production|staging\", container!=\"\", container!=\"POD\"}) by (namespace, pod) / 1024 / 1024",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Network Receive Bytes/sec by Pod",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 9 },
          "targets": [
            {
              "expr": "sum(rate(container_network_receive_bytes_total{namespace=~\"production|staging\"}[1m])) by (namespace, pod)",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        }
      ]
    }
