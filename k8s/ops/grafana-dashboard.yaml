apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: ops
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'dhaba-dashboards'
        orgId: 1
        folder: 'Dhaba Ops'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dhaba-dashboard-json
  namespace: ops
data:
  dhaba-red-geoip.json: |
    {
      "title": "Dhaba Orders: RED metrics and visitor locations",
      "uid": "dhaba-red-geoip",
      "timezone": "browser",
      "refresh": "5s",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "title": "Request rate (req/s)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "options": { "graphMode": "area", "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "fixed", "fixedColor": "green" } } },
          "targets": [{ "expr": "sum(rate(traefik_service_requests_total{service=~\"production.*|staging.*\"}[1m]))" }]
        },
        {
          "id": 2,
          "title": "Error rate (5xx %)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "options": { "graphMode": "area", "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "percent", "color": { "mode": "fixed", "fixedColor": "red" } } },
          "targets": [{ "expr": "100 * (sum(rate(traefik_service_requests_total{service=~\"production.*|staging.*\",code=~\"5..\"}[1m])) or vector(0)) / clamp_min(sum(rate(traefik_service_requests_total{service=~\"production.*|staging.*\"}[1m])), 0.001)" }]
        },
        {
          "id": 3,
          "title": "Latency p50",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "options": { "graphMode": "area", "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "fixed", "fixedColor": "yellow" } } },
          "targets": [{ "expr": "histogram_quantile(0.50, sum(rate(traefik_service_request_duration_seconds_bucket{service=~\"production.*|staging.*\"}[2m])) by (le))" }]
        },
        {
          "id": 4,
          "title": "Latency p95",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "options": { "graphMode": "area", "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "fixed", "fixedColor": "orange" } } },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(traefik_service_request_duration_seconds_bucket{service=~\"production.*|staging.*\"}[2m])) by (le))" }]
        },
        {
          "id": 5,
          "title": "Request rate by status",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [{ "expr": "sum(rate(traefik_service_requests_total{service=~\"production.*|staging.*\"}[1m])) by (code)", "legendFormat": "HTTP {{code}}" }]
        },
        {
          "id": 6,
          "title": "Latency percentiles (p50 / p95 / p99)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(traefik_service_request_duration_seconds_bucket{service=~\"production.*|staging.*\"}[2m])) by (le))", "legendFormat": "p50" },
            { "expr": "histogram_quantile(0.95, sum(rate(traefik_service_request_duration_seconds_bucket{service=~\"production.*|staging.*\"}[2m])) by (le))", "legendFormat": "p95" },
            { "expr": "histogram_quantile(0.99, sum(rate(traefik_service_request_duration_seconds_bucket{service=~\"production.*|staging.*\"}[2m])) by (le))", "legendFormat": "p99" }
          ]
        },
        {
          "id": 7,
          "title": "Traffic by Microservice",
          "type": "bargauge",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 12 },
          "targets": [{ "expr": "sum(increase(traefik_service_requests_total{service=~\"production.*|staging.*\"}[15m])) by (service)", "legendFormat": "{{service}}" }]
        },
        {
          "id": 8,
          "title": "Top Cities (Pakistan & Global)",
          "type": "bargauge",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 12 },
          "targets": [{ "expr": "topk(10, sum by (geoip_city_name) (count_over_time({job=\"dhaba-access\"} | json [15m])))", "legendFormat": "{{geoip_city_name}}" }]
        },
        {
          "id": 9,
          "title": "Pakistan & Global Visitor Heatmap",
          "type": "geomap",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 19 },
          "options": {
            "view": { "id": "coords", "lat": 30.3753, "lon": 69.3451, "zoom": 4.5 },
            "layers": [
              {
                "type": "heatmap",
                "name": "Visitors",
                "config": { "radius": 20, "blur": 15 },
                "location": { "mode": "coords", "latitude": "geoip_latitude", "longitude": "geoip_longitude" }
              }
            ]
          },
          "targets": [{ "expr": "sum by (geoip_city_name, geoip_latitude, geoip_longitude) (count_over_time({job=\"dhaba-access\"} | json [15m]))", "format": "table" }]
        },
        {
          "id": 10,
          "title": "Access log (latest)",
          "type": "logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 28 },
          "options": { "showTime": true, "wrapLogMessage": true },
          "targets": [{ "expr": "{job=\"dhaba-access\"} |= \"\"" }]
        }
      ]
    }
