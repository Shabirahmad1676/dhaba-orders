apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-deployer
  namespace: staging
rules:
  - apiGroups: ["", "apps", "networking.k8s.io", "policy"]
    resources: ["deployments", "services", "configmaps", "ingresses", "poddisruptionbudgets", "statefulsets", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer-staging
  namespace: staging
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: ops
roleRef:
  kind: Role
  name: namespace-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-deployer
  namespace: production
rules:
  - apiGroups: ["", "apps", "networking.k8s.io", "policy"]
    resources: ["deployments", "services", "configmaps", "ingresses", "poddisruptionbudgets", "statefulsets", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer-production
  namespace: production
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: ops
roleRef:
  kind: Role
  name: namespace-deployer
  apiGroup: rbac.authorization.k8s.io
