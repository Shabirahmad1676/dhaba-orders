apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dhaba-ingress
spec:
  rules:
    - host: PLACEHOLDER.test
      http:
        paths:
          - path: /api/menu
            pathType: Prefix
            backend:
              service: { name: menu-api, port: { number: 80 } }
          - path: /api/orders
            pathType: Prefix
            backend:
              service: { name: orders-api, port: { number: 80 } }
          - path: /api/stats
            pathType: Prefix
            backend:
              service: { name: stats-api, port: { number: 80 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
